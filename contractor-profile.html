<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Complete Contractor Profile | BidMyTint</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #172033;
    }

    header {
      background: #071b33;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
    }

    .logo span {
      color: #d4af37;
    }

    .header-right {
      color: #d4af37;
      font-weight: 600;
    }

    .container {
      max-width: 650px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 35px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      color: #071b33;
    }

    .intro {
      color: #5f6877;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 18px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd1d8;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #d4af37;
      color: #071b33;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">BidMy<span>Tint</span></div>
  <div class="header-right">Contractor Network</div>
</header>

<div class="container">
  <div class="card">

    <h1>Complete Your Contractor Profile</h1>

    <p class="intro">
      Your email has been verified. Complete your company information below
      to submit your application to the BidMyTint contractor network.
    </p>

    <label for="companyName">Company Name</label>
    <input type="text" id="companyName">

    <label for="phone">Business Phone</label>
    <input type="tel" id="phone">

    <label for="serviceArea">Service Area</label>
    <input
      type="text"
      id="serviceArea"
      placeholder="Example: Broward County, FL"
    >

    <button type="button" id="saveProfile" onclick="saveContractorProfile()">
    Submit Contractor Application
    </button>

    <div id="message"></div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  
const SUPABASE_URL = 'https://pkdleiskrqxbouozmquo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WtjKwXyzGuXL1xjpAwFCxw_F97Ul5W8';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function saveContractorProfile() {
  const companyName = document.getElementById('companyName').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const serviceArea = document.getElementById('serviceArea').value.trim();
  const message = document.getElementById('message');

  if (!companyName || !phone || !serviceArea) {
    message.textContent = 'Please complete all fields.';
    return;
  }

  message.textContent = 'Submitting your application...';

  const { data: { user }, error: userError } = await db.auth.getUser();

  if (userError || !user) {
    message.textContent = 'Please sign in before completing your profile.';
    window.location.href = 'contractor-login.html';
    return;
  }

  const { error: profileError } = await db
    .from('contractors')
    .insert({
      user_id: user.id,
      company_name: companyName,
      phone: phone,
      service_area: serviceArea,
      email: user.email,
      status: 'pending'
    });

  if (profileError) {
    console.error(profileError);
    message.textContent = 'Unable to save your contractor application.';
    return;
  }

  message.textContent = 'Application submitted successfully. Your account is pending approval.'; 
}
</script>
</body>
</html>
