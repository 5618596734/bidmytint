<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contractor Login | BidMyTint</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #172033;
    }

    header {
      background: #071b33;
      color: white;
      padding: 24px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      color: #d4af37;
    }

    .login-container {
      max-width: 440px;
      margin: 70px auto;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.10);
    }

    .login-container h2 {
      margin-top: 0;
      text-align: center;
    }

    .login-container p {
      text-align: center;
      color: #667085;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd2da;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #d4af37;
      color: #071b33;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>BidMyTint</h1>
  <div>Contractor Portal</div>
</header>

<div class="login-container">
  <h2>Contractor Login</h2>
  <p>Sign in to view projects and submit sealed proposals.</p>

  <label for="email">Email Address</label>
  <input type="email" id="email" autocomplete="email">

  <label for="password">Password</label>
  <input type="password" id="password" autocomplete="current-password">

  <button type="button" onclick="contractorLogin()">Sign In</button>

  <div id="message"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


const SUPABASE_URL = 'https://pkdleiskrqxbouozmquo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WtjKwXyzGuXL1xjpAwFCxw_F97Ul5W8';
  
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function contractorLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const message = document.getElementById('message');

  message.textContent = 'Signing in...';

  if (!email || !password) {
    message.textContent = 'Please enter your email and password.';
    return;
  }

  const { data, error } = await db.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    console.error(error);
    message.textContent = 'Invalid email or password.';
    return;
  }

  message.textContent = 'Login successful. Redirecting...';

  window.location.href = 'contractor.html';
}
</script>

</body>
</html>
