<!DOCTYPE html>
<html lang="en">
<style>

  margin: 0;

}

header {

</style>  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Details | BidMyTint</title>
</head>

<body>
<header>
  <div class="logo">BidMy<span>Tint</span></div>
  <div class="header-right">Contractor Portal</div>
</header>

<section class="hero">
  <h1>Project Details</h1>
  <p>Review the project information before submitting a sealed proposal.</p>
</section>

<main class="container">
  <a class="back-link" href="contractor.html">← Back to Project Opportunities</a>

  <div id="projectDetails" class="project-details">
    <p>Loading project details...</p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://pkdleiskrqxbouozmquo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WtjKwXyzGuXL1xjpAwFCxw_F97Ul5W8';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function requireContractorLogin() {
  const { data: { session } } = await db.auth.getSession();

  if (!session) {
    window.location.href = 'contractor-login.html';
    return false;
  }

  return true;
}

requireContractorLogin();  
function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

async function loadProject() {
  const projectDetails = document.getElementById('projectDetails');
  const params = new URLSearchParams(window.location.search);
  const projectId = params.get('id');

  if (!projectId) {
    projectDetails.innerHTML = '<p>Project not found.</p>';
    return;
  }
const response = await fetch(
  `${SUPABASE_URL}/functions/v1/get-contractor-project`,
  {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${(await db.auth.getSession()).data.session.access_token}`
    },
    body: JSON.stringify({
      projectId: Number(projectId)
    })
  }
);

const functionData = await response.json();

if (!response.ok || !functionData?.success || !functionData?.project) {
  projectDetails.innerHTML = `
    <h2>This project is no longer available.</h2>
    <p style="margin-top:10px;">
      This project has been closed or awarded to another contractor.
    </p>
  `;
  return false;
}

const data = functionData.project;
  projectDetails.innerHTML = `
    <div class="detail-row">
      <div class="detail-label">Project Number</div>
      <div class="detail-value">#${data.id}</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Property Type</div>
      <div class="detail-value">${escapeHtml(data.property_type || 'Not provided')}</div>
    </div>

<div class="detail-row">
  <div class="detail-label">City</div>
  <div class="detail-value">${escapeHtml(data.city || 'Not provided')}</div>
</div>    
   
    
    <div class="detail-row">
      <div class="detail-label">ZIP Code</div>
      <div class="detail-value">${escapeHtml(data.zip_code || 'Not provided')}</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Project Goal</div>
      <div class="detail-value">${escapeHtml(data.goals || 'Not provided')}</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Number of Windows</div>
      <div class="detail-value">${escapeHtml(data.window_count || 'Not provided')}</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">High Windows</div>
      <div class="detail-value">${escapeHtml(data.high_windows || 'Not provided')}</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Window Height</div>
      <div class="detail-value">${escapeHtml(data.window_height || 'Not provided')}</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Measurements</div>
      <div class="detail-value">${escapeHtml(data.measurements || 'Not provided')}</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Existing Film</div>
      <div class="detail-value">${escapeHtml(data.existing_film || 'Not provided')}</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Removal Details</div>
      <div class="detail-value">${escapeHtml(data.removal_details || 'Not provided')}</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Timing</div>
      <div class="detail-value">${escapeHtml(data.timing || 'Not provided')}</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Additional Notes</div>
      <div class="detail-value">${escapeHtml(data.notes || 'None')}</div>
    </div>
${Array.isArray(data.photos) && data.photos.length > 0 ? `
  <div class="detail-row">
    <div class="detail-label">Project Photos</div>
    <div class="detail-value">
      ${data.photos.map(photo => `
        <img
          src="${escapeHtml(photo)}"
          alt="Project photo"
          style="max-width:100%; width:300px; height:auto; margin:10px 10px 10px 0; border-radius:8px;"
        >
      `).join('')}
    </div>
  </div>
` : ''}
<button type="button" onclick="showProposalForm()">Submit Sealed Proposal</button>
    `;
}

function showProposalForm() {
  const projectDetails = document.getElementById('projectDetails');

  projectDetails.insertAdjacentHTML('beforeend', `
    <div id="proposalForm" style="margin-top:30px; border-top:2px solid #eceef1; padding-top:25px;">
      <h2>Submit Your Sealed Proposal</h2>

      <div class="detail-row">
        <div class="detail-label">Proposal Price</div>
        <input id="proposalPrice" type="number" placeholder="$0.00">
      </div>

      <div class="detail-row">
        <div class="detail-label">Film Manufacturer</div>
        <input id="filmManufacturer" type="text" placeholder="Example: 3M, Llumar, Solar Gard">
      </div>

      <div class="detail-row">
        <div class="detail-label">Film / Product</div>
        <input id="filmProduct" type="text" placeholder="Film name or product series">
      </div>

      <div class="detail-row">
        <div class="detail-label">Warranty</div>
        <input id="warranty" type="text" placeholder="Example: Manufacturer lifetime warranty">
      </div>

      <div class="detail-row">
        <div class="detail-label">Availability</div>
        <input id="availability" type="text" placeholder="Example: Can start within 7 days">
      </div>

      <div class="detail-row">
        <div class="detail-label">Proposal Notes</div>
        <textarea id="proposalNotes" rows="5" placeholder="Additional proposal details"></textarea>
      </div>

<button type="button" onclick="submitProposal()">Send Sealed Proposal</button>
      </div>
  `);

  document.getElementById('proposalForm').scrollIntoView({
    behavior: 'smooth'
  });
}  
async function submitProposal() {
  const params = new URLSearchParams(window.location.search);
  const projectId = params.get('id');
const { data: { user }, error: userError } = await db.auth.getUser();

if (userError || !user) {
  alert('Please sign in before submitting a proposal.');
  window.location.href = 'contractor-login.html';
  return;
}

const { data: contractor, error: contractorError } = await db
  .from('contractors')
  .select('id, status')
  .eq('user_id', user.id)
  .single();

if (contractorError || !contractor) {
  console.error(contractorError);
  alert('Contractor profile not found.');
  return;
}

if (contractor.status !== 'approved') {
  alert('Your contractor account must be approved before submitting proposals.');
  return;
}  

  const price = document.getElementById('proposalPrice').value;
  const manufacturer = document.getElementById('filmManufacturer').value;
  const product = document.getElementById('filmProduct').value;
  const warrantyValue = document.getElementById('warranty').value;
  const availabilityValue = document.getElementById('availability').value;
  const notes = document.getElementById('proposalNotes').value;

  if (!price || Number(price) <= 0) {
    alert('Please enter a valid proposal price.');
    return;
  }

 
const { data: submitResult, error: submitError } = await db.functions.invoke(
  'submit-proposal',
  {
    body: {
      projectId: Number(projectId),
      proposalPrice: Number(price),
      filmManufacturer: manufacturer,
      filmProduct: product,
      warranty: warrantyValue,
      availability: availabilityValue,
      proposalNotes: notes
    }
  }
);

if (submitError || !submitResult?.success) {
  console.error('Proposal submission failed:', submitError, submitResult);
  alert(
    submitResult?.error ||
    'There was a problem submitting your proposal. Please try again.'
  );
  return;
}  
  const { error: notificationError } = await db.functions.invoke(
  'notify-customer-proposal',
  {
    body: {
      projectId: Number(projectId)
    }
  }
);

if (notificationError) {
  console.error(
    'Unable to notify customer about new proposal:',
    notificationError
  );
}  
  alert('Your sealed proposal has been submitted successfully.');

  const form = document.getElementById('proposalForm');
  if (form) {
    form.remove();
  }
}
  async function loadAwardedCustomerContact(projectId) {
  const contactSection = document.createElement('div');
  contactSection.style.marginTop = '30px';
  contactSection.style.padding = '22px';
  contactSection.style.background = '#f7f8fa';
  contactSection.style.borderRadius = '8px';

  const { data, error } = await db.functions.invoke(
    'get-awarded-project-contact',
    {
      body: {
        projectId: Number(projectId)
      }
    }
  );

  if (error || !data?.success) {
    contactSection.innerHTML = `
      <strong>Customer Contact Information</strong>
      <p style="margin-bottom:0;">
        Customer contact information will be released to the winning contractor
        after the Project Confirmation Payment clears.
      </p>
    `;
  } else {
    const customer = data?.customer || {};
    contactSection.innerHTML = `
      <strong>Customer Contact Information</strong>

      <div class="detail-row">
        <div class="detail-label">Customer</div>
        <div class="detail-value">${escapeHtml(customer.name || 'Not provided')}</div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Phone</div>
        <div class="detail-value">${escapeHtml(customer.phone || 'Not provided')}</div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Email</div>
        <div class="detail-value">${escapeHtml(customer.email || 'Not provided')}</div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Project Address</div>
        <div class="detail-value">
          ${escapeHtml(customer.address || '')}
          ${escapeHtml(customer.city || '')}
          ${escapeHtml(customer.zipCode || '')}
        </div>
      </div>
    `;
  }

  document.getElementById('projectDetails').appendChild(contactSection);
}  
  loadProject().then((projectLoaded) => {
    const params = new URLSearchParams(window.location.search);
  const projectId = params.get('id');

  if (projectId && projectLoaded !== false) {
  loadAwardedCustomerContact(projectId);
}
  });
</script>
</body>
  
</html>
