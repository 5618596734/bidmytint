<!DOCTYPE html>
<html lang="en">
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f6f8;
  color: #142033;
}

header {
  background: #07182d;
  color: white;
  padding: 20px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 26px;
  font-weight: 700;
}

.logo span {
  color: #d6a84b;
}

.header-right {
  font-size: 14px;
  color: #d8dee7;
}

.hero {
  background: #07182d;
  color: white;
  padding: 50px 7% 60px;
}

.hero h1 {
  margin: 0 0 10px;
  font-size: 40px;
}

.hero p {
  margin: 0;
  color: #cbd3df;
  font-size: 17px;
}

.container {
  width: 86%;
  max-width: 1100px;
  margin: 40px auto;
}

.proposal-card {
  background: white;
  border-radius: 12px;
  padding: 25px;
  margin-bottom: 20px;
  border: 1px solid #e7e9ed;
  box-shadow: 0 4px 18px rgba(0,0,0,.06);
}

.proposal-price {
  font-size: 30px;
  font-weight: 700;
  color: #07182d;
  margin-bottom: 20px;
}

.details {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
}

.detail-label {
  font-size: 12px;
  color: #8a93a2;
  margin-bottom: 5px;
  text-transform: uppercase;
}

.detail-value {
  font-weight: 600;
}

button {
  margin-top: 25px;
  border: 0;
  background: #d6a84b;
  color: #07182d;
  font-weight: 700;
  padding: 14px 22px;
  border-radius: 7px;
  cursor: pointer;
}

@media(max-width: 700px) {
  .details {
    grid-template-columns: 1fr;
  }

  .hero h1 {
    font-size: 32px;
  }
}
</style>
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Proposals | BidMyTint</title>
</head>

<body>
<header>
  <div class="logo">BidMy<span>Tint</span></div>
  <div class="header-right">Customer Portal</div>
</header>

<section class="hero">
  <h1>Your Project Proposals</h1>
  <p>Compare sealed proposals from architectural window film professionals.</p>
</section>

<main class="container">
  <div id="proposalsList">
    <p>Loading proposals...</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://pkdleiskrqxbouozmquo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WtjKwXyzGuXL1xjpAwFCxw_F97Ul5W8';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const params = new URLSearchParams(window.location.search);
const projectId = params.get('id');
const accessToken = params.get('token');

if (!projectId || !accessToken) {
  document.getElementById('proposalsList').innerHTML =
    '<p>This proposal link is invalid or incomplete.</p>';
}
async function loadProposals() {
  if (!projectId || !accessToken) return;

  document.getElementById('proposalsList').innerHTML =
    '<p>Customer access is being verified...</p>';
const { data, error } = await db.functions.invoke('get-customer-proposals', {
  body: {
    projectId: Number(projectId),
    accessToken: accessToken
  }
});

if (error) {
  console.error(error);
  document.getElementById('proposalsList').innerHTML =
    '<p>Unable to load proposals. Please check your project link.</p>';
  return;
}

const proposals = data?.proposals || [];
if (proposals.length === 0) {
  document.getElementById('proposalsList').innerHTML =
    '<p>No proposals have been submitted for this project yet.</p>';
  return;
}

document.getElementById('proposalsList').innerHTML = proposals.map(proposal => `
  <div class="proposal-card">
    <div class="proposal-price">
      $${Number(proposal.proposal_price).toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })}
    </div>

    <div class="details">
      <div>
        <div class="detail-label">Film Manufacturer</div>
        <div class="detail-value">${proposal.film_manufacturer || 'Not provided'}</div>
      </div>

      <div>
        <div class="detail-label">Film / Product</div>
        <div class="detail-value">${proposal.film_product || 'Not provided'}</div>
      </div>

      <div>
        <div class="detail-label">Warranty</div>
        <div class="detail-value">${proposal.warranty || 'Not provided'}</div>
      </div>

      <div>
        <div class="detail-label">Availability</div>
        <div class="detail-value">${proposal.availability || 'Not provided'}</div>
      </div>

      <div>
        <div class="detail-label">Proposal Notes</div>
        <div class="detail-value">${proposal.proposal_notes || 'None'}</div>
      </div>
    </div>

    <button type="button" onclick="acceptProposal(${proposal.id})">Select This Proposal</button>
    </div>
`).join('');  
}

loadProposals();
async function acceptProposal(proposalId) {
  const confirmed = confirm(
    "Are you sure you want to select this proposal? This will award the project to this contractor."
  );

  if (!confirmed) return;

  try {
    const { data, error } = await db.functions.invoke("accept-proposal", {
      body: {
        projectId: Number(projectId),
        proposalId: Number(proposalId),
        accessToken: accessToken
      }
    });

    if (error) {
      console.error(error);
      alert("Unable to select this proposal. Please try again.");
      return;
    }

    if (!data?.success) {
      alert(data?.error || "Unable to select this proposal.");
      return;
    }

    alert("Proposal selected successfully!");

    window.location.reload();
  } catch (error) {
    console.error(error);
    alert("Unable to select this proposal. Please try again.");
  }
}
</script>
</body>
</html>
